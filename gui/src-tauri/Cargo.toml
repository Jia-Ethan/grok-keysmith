[package]
name = "grok-keysmith-gui"
version = "0.1.0-beta.1"
description = "Visual client for grok-keysmith"
edition = "2021"

[lib]
name = "grok_keysmith_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt", "sync"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
